[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-typing"
version = "0.1.0"
description = "A friendly touch-typing tutor for kids"
readme = "README.md"
# 3.12+: PySide6 6.12 has a refcount bug on None that crashes Python 3.11
# during painting; from 3.12, None is immortal (PEP 683) so it's harmless.
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
learn-typing = "typing_tutor.app:main"

[tool.setuptools.packages.find]
include = ["typing_tutor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
timeout = 60   # a forgotten modal dialog fails the test instead of hanging the run

[tool.coverage.run]
source = ["typing_tutor"]
omit = ["typing_tutor/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Word and sentence data reads better compact than one item per line.
exclude = ["typing_tutor/wordlist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode: the UI deliberately uses ★ · – ← etc.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The word bank is a readable multi-line string on purpose.
"typing_tutor/wordlist.py" = ["SIM905"]

[tool.mypy]
python_version = "3.12"
packages = ["typing_tutor"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
