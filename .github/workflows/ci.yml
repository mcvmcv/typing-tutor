name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs everything (lint, formatting, types, tests with coverage).
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          # Windows and macOS run the tests, to catch platform-specific bugs
          # (paths, fonts, key handling, audio, file locking).
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Libraries Qt needs to run headless (the tests use the offscreen platform).
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libpulse0

      - name: Install
        run: |
          python -m venv .venv
          ${{ runner.os == 'Windows' && '.venv\Scripts\pip' || '.venv/bin/pip' }} install -e ".[dev]"

      - name: Check
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: make check

      - name: Test
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\pytest' || '.venv/bin/pytest' }} -q
