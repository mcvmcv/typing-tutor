name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Libraries Qt needs to run headless (the tests use the offscreen platform).
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libpulse0

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Check
        env:
          QT_QPA_PLATFORM: offscreen
        run: make check
