name: Build apps

# Builds a double-click app for each OS with PyInstaller and smoke-tests it.
# Pushing a version tag (e.g. `git tag v0.2.0 && git push --tags`) also
# publishes a GitHub Release with the apps attached.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/build.yml"
      - "pyproject.toml"
      - "typing_tutor/smoke.py"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: LearnTyping-windows.exe
          - os: macos-latest
            asset: LearnTyping-macos-apple-silicon.zip
          - os: macos-15-intel
            asset: LearnTyping-macos-intel.zip
          # The oldest supported Ubuntu, so the app runs on older Linux systems too.
          - os: ubuntu-22.04
            asset: LearnTyping-linux.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libpulse0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 pulseaudio
          # A virtual sound card, so the smoke test can check the sounds play.
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=smoke

      - name: Install
        run: pip install ".[build]"

      - name: Build
        run: pyinstaller --noconfirm packaging/learn-typing.spec

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            macOS) app="dist/Learn Typing.app/Contents/MacOS/LearnTyping" ;;
            Windows) app="dist/LearnTyping.exe" ;;
            *) app="dist/LearnTyping" ;;
          esac
          status=0
          "$app" --smoke-test || status=$?
          # Windowed Windows builds have no console, so the report is in a file.
          if [ -f smoke-test.txt ]; then cat smoke-test.txt; fi
          exit $status

      - name: Package
        run: |
          case "$RUNNER_OS" in
            macOS) ditto -c -k --keepParent "dist/Learn Typing.app" "${{ matrix.asset }}" ;;
            Windows) cp dist/LearnTyping.exe "${{ matrix.asset }}" ;;
            *) tar -czf "${{ matrix.asset }}" -C dist LearnTyping ;;
          esac
          ls -l "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version in pyproject.toml
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Learn Typing $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            --generate-notes
